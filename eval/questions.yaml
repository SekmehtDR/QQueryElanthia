- q: "What happens when my character dies?"
  kind: mechanics
  expect_pages: ["Death"]
- q: "How does resurrection work?"
  kind: mechanics
  expect_pages: ["Resurrection"]
- q: "What currencies are used in Elanthia?"
  kind: mechanics
  expect_pages: ["Currency"]
- q: "What is a lich?"
  kind: mechanics
  expect_pages: ["Lich"]
- q: "What is the Expertise skill?"
  kind: mechanics
  expect_pages: ["Expertise skill"]
- q: "What is Inner Fire?"
  kind: mechanics
  expect_pages: ["Inner fire", "Barbarian"]
- q: "What is the heaviest heavy edged weapon?"
  kind: item
  mode: items
  expect_pages: []
- q: "Which light edged weapons weigh the least?"
  kind: item
  mode: items
  expect_pages: []
# Follow-ups: the second question only makes sense with the first.
- q: "What weapons can they use?"
  kind: mechanics
  history: ["Tell me about the Barbarian guild"]
  expect_pages: ["Barbarian"]
- q: "And what about the Empath?"
  kind: mechanics
  history: ["Which skillsets does a Barbarian have?"]
  expect_pages: ["Empath"]
