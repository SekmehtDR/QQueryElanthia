# Retrieval/answer regression set. Page titles were verified against the index on 2026-10-22.
#   q:            the question as a user would type it
#   kind:         the question kind the planner should detect (item, crafting, place, character, lore,
#                 creature, mechanics, event_news, meta, general)
#   expect_pages: hit if ANY of these pages is in the top-k retrieved (exact page title)
#   history:      earlier user turns in the same conversation (tests follow-up rewriting)
#   mode:         expected planner mode when it is not plain "search"
- q: "What abilities do Barbarians get?"
  kind: mechanics
  expect_pages: ["Barbarian"]
- q: "What are Berserks?"
  kind: mechanics
  expect_pages: ["Barbarian", "Category:Berserks"]
- q: "What do the Barbarian roars do?"
  kind: mechanics
  expect_pages: ["Barbarian", "Roars"]
- q: "Which skillsets does an Empath have?"
  kind: mechanics
  expect_pages: ["Empath"]
- q: "How does the Stealth skill work?"
  kind: mechanics
  expect_pages: ["Stealth skill"]
- q: "What is the Appraisal skill used for?"
  kind: mechanics
  expect_pages: ["Appraisal skill"]
- q: "What does the Tactics skill do?"
  kind: mechanics
  expect_pages: ["Tactics skill"]
- q: "What is Athletics used for?"
  kind: mechanics
  expect_pages: ["Athletics skill"]
- q: "How do I forge weapons?"
  kind: crafting
  expect_pages: ["Forging skill", "Forging guide"]
- q: "What does the Outfitting skill make?"
  kind: crafting
  expect_pages: ["Outfitting skill"]
- q: "Tell me about the Gor'Tog race"
  kind: lore
  expect_pages: ["Concept:Gor'Togs"]
- q: "What are the characteristics of Elves?"
