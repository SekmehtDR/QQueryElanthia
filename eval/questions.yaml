# Retrieval/answer regression set. Page titles were verified against the index on 2026-10-22.
#   q:            the question as a user would type it
#   kind:         the question kind the planner should detect (item, crafting, place, character, lore,
#                 creature, mechanics, event_news, meta, general)
#   expect_pages: hit if ANY of these pages is in the top-k retrieved (exact page title)
#   history:      earlier user turns in the same conversation (tests follow-up rewriting)
#   mode:         expected planner mode when it is not plain "search"
