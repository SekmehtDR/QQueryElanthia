<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="/static/fennick.png">
<title>QQueryElanthia</title>
<style>
  :root { --bg:#f6f4ef; --panel:#fff; --ink:#1f2328; --muted:#6b7280; --accent:#7a3b1e; --line:#e3ded2; --user:#efe6d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16140f; --panel:#1f1c15; --ink:#e8e4d9; --muted:#9a9484; --accent:#d9a066; --line:#332e22; --user:#2a251a; }
  }
  * { box-sizing: border-box; }
  /* Layout: everything lives in #app, so the header, status panel, chat and input share one width and gutter.
     Desktop (default) fills the window up to a wide column; mobile is a phone-width column. */
  :root { --col:1280px; --gutter:32px; --outer:var(--bg); }
  html[data-view="mobile"] { --col:440px; --gutter:14px; --outer:#e9e5db; }
  @media (prefers-color-scheme: dark) { html[data-view="mobile"] { --outer:#0d0c09; } }
  html, body { height:100%; }
  body { margin:0; background:var(--outer); color:var(--ink); font:16px/1.55 system-ui, sans-serif; display:flex; justify-content:center; }
  #app { position:relative; width:100%; max-width:var(--col); height:100dvh; display:flex; flex-direction:column; background:var(--bg); min-width:0; }
  header { padding:14px var(--gutter); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px 16px; flex-wrap:wrap; }
  header .brand { display:flex; align-items:center; gap:12px; min-width:0; }
  header .controls { display:flex; align-items:center; gap:8px; }
  header h1 { font-size:1.15rem; margin:0; flex:0 0 auto; }
  header .ver { font-size:.72rem; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:1px 8px; cursor:default; white-space:nowrap; }
  header button[aria-expanded="true"] { color:var(--accent); border-color:var(--accent); }
  header button { background:none; border:1px solid var(--line); color:var(--muted); border-radius:6px; padding:5px 12px; cursor:pointer; font:inherit; font-size:.9rem; }
  header button:hover { color:var(--ink); border-color:var(--muted); }
  /* Desktop / Mobile switch */
  .viewtoggle { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .viewtoggle button { border:0; border-radius:0; display:inline-flex; align-items:center; gap:6px; }
  .viewtoggle button + button { border-left:1px solid var(--line); }
  .viewtoggle button[aria-pressed="true"] { background:var(--accent); color:var(--bg); }
  .viewtoggle svg { flex:0 0 auto; }
  #log { flex:1; overflow-y:auto; padding:22px var(--gutter); width:100%; }
  .msg { margin:0 0 20px; padding:14px 18px; border-radius:12px; background:var(--panel); border:1px solid var(--line); }
  .msg.user { background:var(--user); margin-left:auto; width:fit-content; max-width:78%; }
  .msg .body { word-wrap:break-word; }
  .msg.user .body { white-space:pre-wrap; }
  .msg .body p { margin:0 0 .65em; }
  .msg .body > :last-child { margin-bottom:0; }
  .msg .body ul, .msg .body ol { margin:.2em 0 .65em; padding-left:1.3em; }
  .msg .body li { margin:.15em 0; }
  .msg .body .md-h { margin:.9em 0 .35em; font-size:1rem; }
  .msg .body code { background:var(--line); border-radius:4px; padding:0 4px; font-size:.9em; }
  .caret { display:inline-block; width:2px; height:1.05em; margin-left:2px; background:var(--accent); vertical-align:text-bottom; animation:fennick-caret 1s steps(2, start) infinite; }
  @keyframes fennick-caret { to { visibility:hidden; } }
  .msg .body table { border-collapse:collapse; margin:8px 0; font-size:.9rem; }
  .msg .body th, .msg .body td { border:1px solid var(--line); padding:3px 8px; text-align:left; }
  .note { color:var(--muted); font-size:.85rem; margin-bottom:6px; }
  /* Citation badges in the answer: solid = cited by the model, dashed = matched to its source automatically. */
  a.cite { display:inline-block; min-width:1.5em; padding:0 6px; margin:0 1px; border-radius:999px; background:var(--accent); color:var(--bg);
    font-size:.72em; font-weight:700; line-height:1.6; text-align:center; text-decoration:none; vertical-align:text-top; cursor:pointer; }
  a.cite.auto { background:transparent; color:var(--accent); border:1px dashed var(--accent); line-height:1.4; }
  a.cite:hover, a.cite.hl { filter:brightness(1.25); box-shadow:0 0 0 2px var(--accent); }
  .sources { margin-top:12px; padding-top:10px; border-top:1px solid var(--line); font-size:.85rem; color:var(--muted); }
  .src-used > summary { cursor:pointer; font-weight:700; color:var(--ink); margin-bottom:4px; }
  .src-used[open] > summary { margin-bottom:6px; }
  .src-row { padding:5px 8px; margin:2px -8px; border-radius:8px; display:grid; grid-template-columns:1.9em 1fr; column-gap:6px; align-items:baseline; transition:background .2s; }
  .src-row .src-n { justify-self:center; min-width:1.5em; text-align:center; border-radius:999px; background:var(--accent); color:var(--bg); font-size:.78em; font-weight:700; }
  .src-row a { color:var(--accent); }
  .src-row .src-snip { grid-column:2; color:var(--muted); font-size:.92em; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .src-row.hl, .src-row.flash { background:color-mix(in srgb, var(--accent) 16%, transparent); }
  .src-more { margin-top:6px; }
  .src-more summary { cursor:pointer; color:var(--muted); }
  .src-legend { margin-top:8px; font-size:.8em; display:flex; gap:14px; align-items:center; }
  .src-legend a.cite { cursor:default; }
  form { width:100%; padding:12px var(--gutter) 6px; display:flex; gap:10px; align-items:flex-end; border-top:1px solid var(--line); background:var(--bg); }
  textarea { flex:1; resize:none; max-height:160px; min-height:46px; padding:11px 14px; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--ink); font:inherit; line-height:1.4; }
  form button { background:var(--accent); color:var(--bg); border:0; border-radius:10px; padding:0 22px; min-height:46px; font:inherit; font-weight:600; cursor:pointer; }
  form button:disabled { opacity:.5; cursor:default; }
  .hint { color:var(--muted); text-align:center; margin-top:10vh; }
  .hint p { max-width:560px; margin:0 auto 18px; }
  header .tag { color:var(--muted); font-size:.85rem; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:12px; }
  .chip { border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:999px; padding:6px 14px; font:inherit; font-size:.88rem; cursor:pointer; }
  .chip:hover { border-color:var(--accent); color:var(--accent); }
  .related { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:.85rem; color:var(--muted); }
  .related .chip { padding:3px 10px; font-size:.82rem; }
  .msg .avatar { float:right; width:56px; height:56px; margin:-2px 0 8px 14px; border-radius:50%; box-shadow:0 2px 8px rgba(0,0,0,.35); }
  .avatar.thinking { animation:fennick-sway 2.4s ease-in-out infinite; }
  .avatar.talking { animation:fennick-bob .45s ease-in-out infinite; }
  @keyframes fennick-sway { 0%, 100% { transform:rotate(-4deg); } 50% { transform:rotate(4deg); } }
  @keyframes fennick-bob { 0%, 100% { transform:translateY(0); } 50% { transform:translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { .avatar.thinking, .avatar.talking { animation:none; } }
  .thinking { color:var(--muted); font-style:italic; display:inline-flex; align-items:baseline; gap:2px; }
  .thinking .dots { display:inline-flex; gap:3px; margin-left:4px; transform:translateY(-1px); }
  /* Three dots that ripple like someone typing: each bounces a beat after the last, while a colour (gold, orange,
     green, feather red: the shades of his portrait) travels across them. */
  .thinking .dots { gap:4px; }
  .thinking .dots i { width:7px; height:7px; border-radius:50%; background:#d9a066; opacity:.35;
    animation:fennick-dots 1.2s infinite ease-in-out, fennick-hue 3.6s infinite linear; }
  .thinking .dots i:nth-child(2) { animation-delay:.18s, .45s; }
  .thinking .dots i:nth-child(3) { animation-delay:.36s, .9s; }
  @keyframes fennick-dots {
    0%, 55%, 100% { opacity:.35; transform:translateY(0) scale(.8); }
    25% { opacity:1; transform:translateY(-6px) scale(1.15); }
  }
  @keyframes fennick-hue {
    0%, 100% { background:#d9a066; } 25% { background:#c4572a; } 50% { background:#6a9a5f; } 75% { background:#d24a3a; }
  }
  /* "Reduce motion" (Windows with animation effects off sets it) means less MOVEMENT, not a frozen page: the dots
     stop bouncing but keep fading and changing colour, so it is still obvious he is working. */
  @keyframes fennick-pulse { 0%, 55%, 100% { opacity:.3; } 25% { opacity:1; } }
  @media (prefers-reduced-motion: reduce) {
    .thinking .dots i { animation:fennick-pulse 1.2s infinite ease-in-out, fennick-hue 3.6s infinite linear; }
    .thinking .dots i:nth-child(2) { animation-delay:.18s, .45s; }
    .thinking .dots i:nth-child(3) { animation-delay:.36s, .9s; }
  }
  #status { display:none; border-bottom:1px solid var(--line); background:var(--panel); font-size:.85rem; color:var(--muted); }
  /* Index controls: start a delta (only what changed) or a full refresh, stop it, and see when it last ran. */
  .idx-top { padding:12px var(--gutter) 6px; }
  .idx-actions { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .idx-actions button { border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:8px; padding:6px 16px; font:inherit; font-size:.9rem; cursor:pointer; }
  .idx-actions button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .idx-actions button:disabled { opacity:.45; cursor:default; }
  .idx-actions .idx-primary:not(:disabled) { background:var(--accent); border-color:var(--accent); color:var(--bg); }
  .idx-actions .idx-primary:hover:not(:disabled) { color:var(--bg); filter:brightness(1.1); }
  .idx-actions .idx-stop { border-color:#d24a3a; color:#d24a3a; }
  .idx-state { flex:1 1 220px; min-width:0; color:var(--ink); }
  .idx-state .ok { color:#3a9d5d; } .idx-state .bad { color:#d24a3a; } .idx-state .run { color:var(--accent); }
  .idx-info { display:grid; grid-template-columns:max-content 1fr; gap:3px 14px; margin:10px 0 4px; }
  .idx-info dt { color:var(--muted); } .idx-info dd { margin:0; color:var(--ink); }
  .idx-info .dim { color:var(--muted); }
  .idx-log { margin:6px var(--gutter) 8px; padding:8px 10px; background:var(--bg); border:1px solid var(--line); border-radius:8px; max-height:9.5em; overflow:auto;
    font:.75rem/1.45 ui-monospace, Consolas, monospace; color:var(--muted); white-space:pre-wrap; word-break:break-word; }
  .idx-log[hidden] { display:none; }
  .idx-link { border:0; background:none; padding:0; margin-left:4px; font:inherit; color:var(--accent); cursor:pointer; text-decoration:underline; }
  .idx-changes { margin:6px var(--gutter) 8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); }
  .idx-changes[hidden] { display:none; }
  .idx-changes header { display:flex; align-items:center; gap:10px; padding:8px 10px; border-bottom:1px solid var(--line); }
  .idx-changes header b { flex:1 1 auto; }
  .idx-changes header button { border:1px solid var(--line); background:none; color:var(--ink); border-radius:6px; padding:2px 10px; font:inherit; cursor:pointer; }
  .idx-changes ul { list-style:none; margin:0; padding:4px 10px 8px; max-height:16em; overflow:auto; }
  .idx-changes li { display:flex; gap:10px; padding:2px 0; align-items:baseline; }
  .idx-changes .act { flex:0 0 5.8em; font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .idx-changes .act.new { color:#3a9d5d; } .idx-changes .act.deleted { color:#d24a3a; }
  .idx-changes a { color:var(--accent); text-decoration:none; } .idx-changes a:hover { text-decoration:underline; }
  .idx-changes .note { padding:8px 10px; color:var(--muted); }
  html[data-view="mobile"] .idx-info { grid-template-columns:1fr; gap:0; }
  html[data-view="mobile"] .idx-info dt { margin-top:6px; }
  html[data-view="mobile"] .idx-actions button { flex:1 1 auto; min-height:42px; }
  #status.show { display:block; }
  #status .bar { padding:8px var(--gutter); cursor:pointer; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  #status .track { flex:0 0 160px; height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
  #status .fill { height:100%; background:var(--accent); width:0; transition:width .6s; }
  #status .detail { padding:0 var(--gutter) 10px; display:none; overflow-x:auto; }
  #status.open .detail { display:block; }
  #status table { border-collapse:collapse; width:100%; }
  #status th, #status td { text-align:right; padding:2px 8px; border-bottom:1px solid var(--line); }
  #status th:first-child, #status td:first-child { text-align:left; }
  #status .live { color:#3a9d5d; } #status .idle { color:var(--muted); }
  .msg .body table { display:block; max-width:100%; overflow-x:auto; }  /* wide tables scroll instead of overflowing */

  /* Polish: empty parts take no space, visible keyboard focus, gentle entrance, tidy scrollbars. */
  .sources:empty, .note:empty, .actions:empty { display:none; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  textarea:focus-visible { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent); }
  .msg { animation:fennick-in .2s ease-out; }
  @keyframes fennick-in { from { opacity:0; transform:translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { .msg { animation:none; } }
  #log { scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  .nb { white-space:nowrap; }  /* a citation badge and the punctuation after it never split across lines */

  /* Welcome screen: his portrait above the greeting and the starter questions. */
  .hint .hero { width:96px; height:96px; border-radius:50%; box-shadow:0 4px 18px rgba(0,0,0,.4); margin:0 auto 14px; display:block; }
  .hint .hero-name { font-weight:700; color:var(--ink); font-size:1.2rem; margin-bottom:6px; }

  /* Input row extras: keyboard hint, "jump to latest", answer actions, friendly errors. */
  #kbd { padding:0 var(--gutter) calc(10px + env(safe-area-inset-bottom)); background:var(--bg); color:var(--muted); font-size:.75rem; }
  #jump { position:absolute; left:50%; transform:translateX(-50%); bottom:118px; z-index:5; padding:6px 14px; border-radius:999px; border:1px solid var(--accent);
    background:var(--panel); color:var(--accent); font:inherit; font-size:.85rem; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.3); }
  #jump[hidden] { display:none; }
  .actions { margin-top:10px; display:flex; gap:8px; }
  .actions button { background:none; border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:3px 12px; font:inherit; font-size:.8rem; cursor:pointer; }
  .actions button:hover { color:var(--ink); border-color:var(--muted); }
  .err { border-left:3px solid #d24a3a; padding:6px 12px; color:var(--ink); }
  .err button { margin-top:6px; background:var(--accent); color:var(--bg); border:0; border-radius:8px; padding:5px 14px; font:inherit; font-size:.85rem; cursor:pointer; }
  html[data-view="desktop"] .msg:not(.user) { max-width:min(100%, 1020px); }  /* a readable measure on wide screens */

  /* Desktop: roomy bubbles, a wider reading measure inside them, centered welcome. */
  html[data-view="desktop"] .hint { margin-top:12vh; }
  html[data-view="desktop"] .hint p { max-width:680px; font-size:1.05rem; }
  html[data-view="desktop"] .msg .avatar { width:64px; height:64px; }

  /* Mobile: a phone-width column (framed when shown on a wide screen), thumb-sized controls, stacked chips. */
  @media (min-width: 481px) { html[data-view="mobile"] #app { border-left:1px solid var(--line); border-right:1px solid var(--line); box-shadow:0 0 40px rgba(0,0,0,.25); } }
  html[data-view="mobile"] header .tag { display:none; }
  /* two tidy rows: who he is, then the controls spread across the full width */
  html[data-view="mobile"] header { flex-direction:column; align-items:stretch; gap:8px; padding-top:10px; padding-bottom:10px; }
  html[data-view="mobile"] header .controls { justify-content:space-between; }
  html[data-view="mobile"] #kbd { display:none; }  /* phones have no Enter-to-send key hint to show */
  html[data-view="mobile"] #jump { bottom:96px; }
  html[data-view="mobile"] .hint .hero { width:80px; height:80px; }
  html[data-view="mobile"] form { padding-bottom:calc(14px + env(safe-area-inset-bottom)); }
  html[data-view="mobile"] header button, html[data-view="mobile"] form button { min-height:42px; }
  html[data-view="mobile"] header button { padding:6px 12px; }
  html[data-view="mobile"] .viewtoggle button span.lbl { display:none; }  /* icons only: the row has to fit */
  html[data-view="mobile"] textarea { font-size:16px; min-height:46px; }  /* 16px stops iOS zooming into the field */
  html[data-view="mobile"] form button { padding:0 16px; }
  html[data-view="mobile"] .msg { padding:12px 14px; margin-bottom:16px; }
  html[data-view="mobile"] .msg.user { max-width:90%; }
  html[data-view="mobile"] .msg .avatar { width:44px; height:44px; margin-left:10px; }
  html[data-view="mobile"] .hint { margin-top:5vh; }
  html[data-view="mobile"] .chips { flex-direction:column; align-items:stretch; }
  html[data-view="mobile"] .chip { padding:10px 14px; text-align:left; font-size:.95rem; }
  html[data-view="mobile"] .related .chip { padding:7px 12px; }
  html[data-view="mobile"] #status .track { flex:1 1 100%; }
  html[data-view="mobile"] .src-row { grid-template-columns:1.9em 1fr; }
</style>
<script>
  // Pick the layout before first paint so the page never flashes the wrong one: the saved choice, else mobile on a
  // phone-sized screen, else desktop. (An existing data-view, e.g. in a test page, is left alone.)
  (function () {
    const root = document.documentElement;
    if (root.dataset.view) return;
    let v = null;
    try { v = localStorage.getItem('epedia.view'); } catch (e) {}
    if (v !== 'desktop' && v !== 'mobile') v = matchMedia('(max-width: 640px)').matches ? 'mobile' : 'desktop';
    root.dataset.view = v;
  })();
</script>
</head>
<body>
<div id="app">
<header>
  <div class="brand"><h1 id="pname">Ask about DragonRealms</h1><span class="ver" id="pver" hidden></span><span class="tag" id="ptag"></span></div>
  <div class="controls">
  <div class="viewtoggle" role="group" aria-label="Layout">
    <button id="vdesk" type="button" aria-pressed="true" title="Desktop layout">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span class="lbl">Desktop</span>
    </button>
    <button id="vmob" type="button" aria-pressed="false" title="Mobile layout">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg><span class="lbl">Mobile</span>
    </button>
  </div>
  <button id="statusbtn" type="button" aria-expanded="false" aria-controls="status" title="Show or hide index details">Index</button>
  <button id="new" type="button" title="Start a fresh conversation">New chat</button>
  </div>
</header>
<div id="status">
  <div class="idx-top">
    <div class="idx-actions" role="group" aria-label="Index controls">
      <button id="idxdelta" type="button" class="idx-primary" title="Fetch only what changed on the wiki since the last update, then refresh just those pages">Start delta</button>
      <button id="idxfull" type="button" title="Re-walk the whole wiki, compare every page and refresh everything that differs (slower, but thorough)">Start full</button>
      <button id="idxstop" type="button" class="idx-stop" hidden title="Stop the running job. Safe: the next run picks up where this one left off">Stop</button>
      <span id="idxstate" class="idx-state" role="status"></span>
    </div>
    <dl class="idx-info" id="idxinfo"></dl>
  </div>
  <pre class="idx-log" id="idxlog" hidden></pre>
  <div class="idx-changes" id="idxchanges" hidden></div>
  <div class="bar" id="statusbar" title="Click for per-namespace details"><span id="stext">Loading index status…</span><div class="track"><div class="fill" id="sfill"></div></div></div>
  <div class="detail" id="sdetail"></div>
</div>
<div id="log"><div class="hint" id="hint"><p>Answers come from Elanthipedia and link back to the pages they used.</p></div></div>
<button id="jump" type="button" hidden>↓ Jump to latest</button>
<form id="form">
  <textarea id="q" rows="1" placeholder="Ask about DragonRealms…" aria-label="Your question" autofocus></textarea>
  <button id="send" type="submit" disabled>Ask</button>
</form>
<div id="kbd">Enter to send · Shift+Enter for a new line</div>
</div>
<script src="/static/render.js"></script>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'), send = document.getElementById('send');
let sessionId = null;
try { sessionId = localStorage.getItem('epedia.session'); } catch (e) {}

async function ensureSession() {
  if (sessionId) return;
  const r = await fetch('/api/sessions', { method: 'POST' });
  sessionId = (await r.json()).session_id;
  try { localStorage.setItem('epedia.session', sessionId); } catch (e) {}
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// Scrolling: follow the answer while the reader is at the bottom; once they scroll up to read something, stop
// pulling them back and offer a button instead.
let busy = false, stick = true;
const jump = document.getElementById('jump');
function toEnd(force) {
  if (force || stick) { log.scrollTop = log.scrollHeight; stick = true; jump.hidden = true; }
  else if (busy) jump.hidden = false;
}
log.addEventListener('scroll', () => {
  stick = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  jump.hidden = stick || !busy;
});

  requestAnimationFrame(() => {  // after the folded lists have opened and laid out

function add(role, text) {

// The animated "is thinking" line shown in an answer box until the first word arrives.

// Fennick's portrait in the corner of an answer. He sways while thinking and his mouth opens and closes in time
// with the words as they arrive, then he settles. Returns {token, stop}; both are no-ops without a persona.
const FRAMES = ['/static/fennick.png', '/static/fennick_talk.png'];
FRAMES.forEach(src => { const im = new Image(); im.src = src; });  // preload so the first word does not flicker
function makeAvatar(msg) {
  if (!(persona && persona.enabled)) return { token() {}, stop() {} };
  const img = document.createElement('img');
  img.className = 'avatar thinking'; img.src = FRAMES[0]; img.alt = persona.name;
  img.width = 56; img.height = 56; img.decoding = 'async';
  msg.prepend(img);
  let open = false, lastSwap = 0, closeTimer = null;
  const set = (on) => { open = on; img.src = FRAMES[on ? 1 : 0]; };
  return {
    token() {
      img.classList.remove('thinking'); img.classList.add('talking');
      const now = performance.now();
      if (now - lastSwap > 110) { set(!open); lastSwap = now; }  // a mouth flap about every tenth of a second
      clearTimeout(closeTimer);
      closeTimer = setTimeout(() => set(false), 260);  // a pause in the words closes his mouth
    },
    stop() {
      clearTimeout(closeTimer); set(false);
      img.classList.remove('talking', 'thinking');
    },

}
// One source entry: its number (matching the badge in the answer), a link to the wiki page, and an excerpt.
function srcRow(s) {
  return `<div class="src-row" data-n="${s.n}"><span class="src-n">${s.n}</span>` +
    `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}${s.section ? ' — ' + esc(s.section) : ''}</a>` +
    (s.snippet ? `<div class="src-snip">${esc(s.snippet)}</div>` : '') + '</div>';

// "Sources used" lists only what the answer actually cites; the rest of what was searched is folded away.
function showSources(d, sources, cited, related, finalText) {
  const el = d.querySelector('.sources');
  let html = '';
  if (sources.length) {
    const used = sources.filter(s => cited.includes(s.n)), rest = sources.filter(s => !cited.includes(s.n));
    // Folded away by default so the answer stays the focus; a click on the summary or on any badge opens it.
    if (used.length) {
      html += `<details class="src-used"><summary>Sources used (${used.length})</summary>` + used.map(srcRow).join('');
      if (rest.length) html += `<details class="src-more"><summary>Also consulted (${rest.length})</summary>${rest.map(srcRow).join('')}</details>`;
      if (/\[\d+\*\]/.test(finalText || '')) html += '<div class="src-legend"><span><a class="cite">1</a> cited by Fennick</span>' +
        '<span><a class="cite auto">1</a> matched to its source automatically</span></div>';
      html += '</details>';
    } else {  // nothing was tagged: say so, rather than implying every page below was used
      html += `<details class="src-used"><summary>Pages consulted (${sources.length})</summary>` +
        '<div>No line of this answer could be tied to a single page, so none are marked as used.</div>' +
        sources.map(srcRow).join('') + '</details>';
    }
  }
  el.innerHTML = html;
  if (related && related.length) {
    const r = document.createElement('div');
    r.className = 'related';
    r.append('Pull on a thread: ');

      const b = document.createElement('button');
      b.className = 'chip'; b.type = 'button'; b.textContent = t.replace(/^[A-Za-z]+:/, '');
      b.title = t; b.onclick = () => ask('Tell me about ' + t.replace(/^[A-Za-z]+:/, ''));

}

// A friendly, recoverable error in place of the answer.
function showError(body, detail, question) {

  const box = document.createElement('div'); box.className = 'err';
  box.append((persona && persona.enabled ? persona.name + ' lost his place' : 'Something went wrong') + ': ' + detail);
  const retry = document.createElement('button'); retry.type = 'button'; retry.textContent = 'Try again';
  retry.onclick = () => ask(question);

// Actions under a finished answer.
function addActions(msg, text) {
  const bar = document.createElement('div'); bar.className = 'actions';
  const copy = document.createElement('button'); copy.type = 'button'; copy.textContent = 'Copy answer';
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(text.replace(/\s*\[\d+\*?\]/g, '')); copy.textContent = 'Copied ✓'; }
    catch (e) { copy.textContent = 'Copy failed'; }

// One answer at a time: a starter chip clicked mid-stream must not start a second answer on top of the first.
async function ask(text) {
  if (busy) return;
  busy = true; syncSend();
  try { await runAsk(text); }
  finally { busy = false; syncSend(); jump.hidden = true; q.focus(); }
}
async function runAsk(text) {
  document.getElementById('hint')?.remove();
  await ensureSession();
  add('user', text);
  const a = add('assistant', ''), body = a.querySelector('.body'), note = a.querySelector('.note');
  const who = persona && persona.enabled ? persona.name : null;
  const thinking = thinkingEl(who ? who + ' is thinking' : 'Thinking');
  body.append(thinking);  // replaced by the first token (or an error), so it needs no cleanup
  const mouth = makeAvatar(a);  // Fennick in the corner of his answer; no-op when the persona is off
  let full = '', sources = [], frame = 0;
  // Format the growing answer live: re-render at most once per animation frame as words arrive.
  const paint = (streaming) => {
    body.innerHTML = renderMarkdown(full, sources, streaming) + (streaming ? '<span class="caret"></span>' : '');
  };
  const schedule = () => {
    if (!frame) frame = requestAnimationFrame(() => { frame = 0; paint(true); toEnd(); });
  };
  const settle = () => { if (frame) { cancelAnimationFrame(frame); frame = 0; } };
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ session_id: sessionId, message: text }) });
    if (!r.ok || !r.body) {  // a 4xx/5xx or a proxy page is not an event stream: say so instead of waiting forever
      let detail = '';
      try { detail = (await r.text()).slice(0, 200); } catch (e) { /* no body */ }
      throw new Error('the server answered ' + r.status + (detail ? ': ' + detail : ''));
    }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '', finished = false;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const raw = buf.slice(0, i); buf = buf.slice(i + 2);
        const evName = /event: (\w+)/.exec(raw)?.[1], m = /data: (.*)/s.exec(raw);
        if (!evName || !m) continue;  // keep-alives or anything that is not a complete event
        let data;
        try { data = JSON.parse(m[1]); } catch (e) { continue; }
        const ev = evName;
        if (ev === 'done' || ev === 'error') finished = true;
        if (ev === 'sources') {
          sources = data.sources;
          // The search is done; he is now reading what he found and about to write.
          const thinkLabel = thinking.querySelector('.label');
          if (thinkLabel && !full) thinkLabel.textContent = who ? who + ' is leafing through his notes' : 'Reading the pages';
          const label = data.kind && data.kind !== 'general' && data.kind !== 'meta' ? ' (' + data.kind.replace('_', ' ') + ')' : '';
          if (label || (data.standalone_q && data.standalone_q.trim() !== text.trim())) note.textContent = 'Searching' + label + ': ' + data.standalone_q;
        } else if (ev === 'token') { full += data.text; schedule(); mouth.token(); }
        else if (ev === 'done') {
          settle(); mouth.stop();
          if (data.answer) full = data.answer;  // the final text, with tags added for lines the model left uncited
          paint(false); showSources(a, sources, data.cited, data.related, full);
          if (full.trim()) addActions(a, full);
        }
        else if (ev === 'error') { settle(); mouth.stop(); showError(body, data.message, text); }
        toEnd();
      }
    }
    if (!finished) {  // the connection closed before "done": keep what arrived, but do not pretend it is complete
      settle(); mouth.stop();
      if (full.trim()) {
        paint(false);
        const warn = document.createElement('div'); warn.className = 'note';
        warn.textContent = 'The connection ended early, so this answer may be incomplete.';
        body.append(warn);
      } else showError(body, 'the connection ended before an answer arrived', text);
    }
  } catch (e) { settle(); mouth.stop(); showError(body, String(e), text); }
  settle(); mouth.stop();
}
function fmtEta(min) { return min == null ? '' : ' · ETA ' + Math.floor(min / 60) + 'h ' + String(min % 60).padStart(2, '0') + 'm'; }
async function refreshStatus() {
  try {
    const s = await (await fetch('/api/status')).json();
    const pct = s.total ? s.fetched / s.total * 100 : 0;
    const state = s.complete ? 'complete' : s.crawling ? `<span class="live">● crawling ${s.crawl_per_min}/min</span>${fmtEta(s.eta_minutes)}` : '<span class="idle">○ crawl idle</span>';
    document.getElementById('stext').innerHTML = `Index: ${s.fetched.toLocaleString()} / ${s.total.toLocaleString()} pages (${pct.toFixed(1)}%) · ${state}`;
    document.getElementById('sfill').style.width = pct + '%';
    const rows = s.namespaces.map(n => `<tr><td>${n.ns} ${esc(n.name)}</td><td>${n.pages.toLocaleString()}</td><td>${n.fetched.toLocaleString()}</td><td>${n.indexed.toLocaleString()}</td><td>${n.errors}</td></tr>`).join('');
    document.getElementById('sdetail').innerHTML = `<table><tr><th>Namespace</th><th>Pages</th><th>Crawled</th><th>Searchable</th><th>Errors</th></tr>${rows}</table>` +
      `<div>${s.chunks.toLocaleString()} searchable chunks · ${s.errors} page errors${s.last_sync ? ' · last sync ' + esc(s.last_sync) : ''}${s.last_fetch ? ' · last fetch ' + esc(s.last_fetch) : ''}</div>`;
  } catch (e) { document.getElementById('stext').textContent = 'Index status unavailable'; }
}
document.getElementById('statusbar').addEventListener('click', () => document.getElementById('status').classList.toggle('open'));

// ---- Index controls: Start delta / Start full / Stop, and when the index last ran -------------------------------
function when(iso) {  // "10/22/2026, 3:04 PM (2 h ago)"
  if (!iso) return null;
  const t = new Date(iso);
  if (isNaN(t)) return esc(iso);
  const m = Math.max(0, Math.round((Date.now() - t.getTime()) / 60000));
  const ago = m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago';
  return t.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) + ` <span class="dim">(${ago})</span>`;
}
function runLine(r) {
  if (!r) return '<span class="dim">never</span>';
  const bits = [when(r.at), `${(r.changed || 0).toLocaleString()} changed`, `${(r.deleted || 0).toLocaleString()} removed`];
  if (r.seconds != null) bits.push('took ' + (r.seconds >= 90 ? Math.round(r.seconds / 60) + ' min' : Math.round(r.seconds) + ' s'));
  if (r.errors) bits.push(`<span class="bad">${r.errors} errors</span>`);
  let out = bits.join(' · ');
  if (r.id && ((r.changed || 0) + (r.deleted || 0)) > 0) out += ` <button type="button" class="idx-link" data-run="${r.id}">View details</button>`;
  return out;
}
let openRun = null;
async function showChanges(id) {
  const box = document.getElementById('idxchanges');
  if (openRun === id && !box.hidden) { box.hidden = true; openRun = null; return; }  // second click folds it
  openRun = id; box.hidden = false; box.innerHTML = '<div class="note">Loading…</div>';
  try {
    const r = await fetch('/api/index/changes/' + id);
    if (!r.ok) throw new Error(r.status);
    const c = await r.json();
    const title = `${c.kind === 'full' ? 'Full refresh' : 'Delta update'} · ${when(c.at)}`;
    let body;
    if (!c.recorded) body = '<div class="note">This run was before page lists were kept, so only the counts are known. Later runs list every page.</div>';
    else {
      const all = Math.max(c.total, c.expected || 0);
      const shown = c.pages.length < all ? `<div class="note">Showing ${c.pages.length.toLocaleString()} of ${all.toLocaleString()} pages.</div>` : '';
      body = '<ul>' + c.pages.map(p => `<li><span class="act ${esc(p.action)}">${esc(p.action)}</span><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a></li>`).join('') + '</ul>' + shown;
    }
    box.innerHTML = `<header><b>${title}: ${c.total.toLocaleString()} page${c.total === 1 ? '' : 's'}</b><button type="button" id="idxchangesclose">Close</button></header>${body}`;
    document.getElementById('idxchangesclose').addEventListener('click', () => { box.hidden = true; openRun = null; });
  } catch (e) { box.innerHTML = '<div class="note">Could not load the page list.</div>'; }
}
document.getElementById('idxinfo').addEventListener('click', e => {  // the list is redrawn every few seconds, so listen on the container
  const b = e.target.closest('[data-run]');

});
function mmss(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
let jobTimer = null, lastJobRunning = false;
function renderIndex(j) {
  const job = j.job || {};
  const delta = document.getElementById('idxdelta'), full = document.getElementById('idxfull'), stop = document.getElementById('idxstop');
  delta.disabled = full.disabled = !!job.running;
  stop.hidden = !job.running;
  const st = document.getElementById('idxstate');
  if (job.running) {
    st.innerHTML = `<span class="run">● ${esc(job.label)} running</span> · ${mmss(job.elapsed_s || 0)}`;
  } else if (job.started_at && job.finished_at) {
    const ok = job.exit_code === 0 && !job.stopped;
    st.innerHTML = job.stopped ? `■ ${esc(job.label)} stopped ${when(job.finished_at)}`
      : ok ? `<span class="ok">✓ ${esc(job.label)} finished</span> ${when(job.finished_at)}`
      : `<span class="bad">✗ ${esc(job.label)} failed (exit ${job.exit_code})</span> ${when(job.finished_at)}`;
  } else st.textContent = '';
  const log = document.getElementById('idxlog');
  const failed = job.finished_at && (job.exit_code !== 0 || job.stopped);
  log.hidden = !(job.log && job.log.length && (job.running || failed));
  if (!log.hidden) { log.textContent = job.log.slice(-8).join('\n'); log.scrollTop = log.scrollHeight; }
  const waiting = (j.pending_crawl || j.pending_index)
    ? `${(j.pending_crawl || 0).toLocaleString()} to fetch · ${(j.pending_index || 0).toLocaleString()} to index` : '<span class="dim">nothing</span>';
  document.getElementById('idxinfo').innerHTML =
    `<dt>Last delta update</dt><dd>${runLine(j.last_delta)}</dd>` +
    `<dt>Last full refresh</dt><dd>${runLine(j.last_full)}</dd>` +
    `<dt>Newest wiki edit seen</dt><dd>${when(j.newest_edit_seen) || '<span class="dim">unknown</span>'}</dd>` +
    `<dt>Waiting</dt><dd>${waiting}</dd>` +
    `<dt>Reading from</dt><dd>${esc(j.source || '?')}${j.primary_source && j.primary_source !== j.source ? ` <span class="dim">(index built from ${esc(j.primary_source)})</span>` : ''}</dd>`;
  // poll quickly while a job runs so the log and clock feel live; the slow poll covers the rest
  if (job.running && !jobTimer) jobTimer = setInterval(loadIndexInfo, 1500);
  if (!job.running && jobTimer) { clearInterval(jobTimer); jobTimer = null; }
  if (lastJobRunning && !job.running) refreshStatus();  // counts changed while it ran

}
async function loadIndexInfo() {

}
async function indexAction(path, body) {
