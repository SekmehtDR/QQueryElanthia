<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QQueryElanthia</title>
<style>
  :root { --bg:#f6f4ef; --panel:#fff; --ink:#1f2328; --muted:#6b7280; --accent:#7a3b1e; --line:#e3ded2; --user:#efe6d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16140f; --panel:#1f1c15; --ink:#e8e4d9; --muted:#9a9484; --accent:#d9a066; --line:#332e22; --user:#2a251a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui, sans-serif; display:flex; flex-direction:column; height:100dvh; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:1.05rem; margin:0; flex:1; }
  header button { background:none; border:1px solid var(--line); color:var(--muted); border-radius:6px; padding:4px 10px; cursor:pointer; }
  #log { flex:1; overflow-y:auto; padding:16px; max-width:820px; width:100%; margin:0 auto; }
  .msg { margin:0 0 18px; padding:12px 14px; border-radius:10px; background:var(--panel); border:1px solid var(--line); }
  .msg.user { background:var(--user); }
  .msg .body { white-space:pre-wrap; word-wrap:break-word; }
  .msg .body table { border-collapse:collapse; margin:8px 0; font-size:.9rem; }
  .msg .body th, .msg .body td { border:1px solid var(--line); padding:3px 8px; text-align:left; }
  .note { color:var(--muted); font-size:.85rem; margin-bottom:6px; }
  .sources { margin-top:10px; font-size:.85rem; color:var(--muted); }
  .sources a { color:var(--accent); }
  .sources div.cited { color:var(--ink); }
  a.cite { color:var(--accent); text-decoration:none; font-size:.8em; vertical-align:super; }
  form { max-width:820px; width:100%; margin:0 auto; padding:12px 16px 20px; display:flex; gap:8px; }
  textarea { flex:1; resize:none; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--ink); font:inherit; }
  form button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:0 18px; font:inherit; cursor:pointer; }
  form button:disabled { opacity:.5; cursor:default; }
  .hint { color:var(--muted); text-align:center; margin-top:10vh; }
  .hint p { max-width:560px; margin:0 auto 18px; }
  header .tag { color:var(--muted); font-size:.85rem; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:12px; }
  .chip { border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:999px; padding:6px 14px; font:inherit; font-size:.88rem; cursor:pointer; }
  .chip:hover { border-color:var(--accent); color:var(--accent); }
  .related { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:.85rem; color:var(--muted); }
  .related .chip { padding:3px 10px; font-size:.82rem; }
  #status { border-bottom:1px solid var(--line); background:var(--panel); font-size:.85rem; color:var(--muted); }
  #status .bar { max-width:820px; margin:0 auto; padding:8px 16px; cursor:pointer; display:flex; gap:12px; align-items:center; }
  #status .track { flex:0 0 160px; height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
  #status .fill { height:100%; background:var(--accent); width:0; transition:width .6s; }
  #status .detail { max-width:820px; margin:0 auto; padding:0 16px 10px; display:none; }
  #status.open .detail { display:block; }
  #status table { border-collapse:collapse; width:100%; }
  #status th, #status td { text-align:right; padding:2px 8px; border-bottom:1px solid var(--line); }
  #status th:first-child, #status td:first-child { text-align:left; }
  #status .live { color:#3a9d5d; } #status .idle { color:var(--muted); }
</style>
</head>
<body>
<header><h1 id="pname">Ask about DragonRealms</h1><span class="tag" id="ptag"></span><button id="new">New chat</button></header>
<div id="status" title="Click for details">
  <div class="bar" id="statusbar"><span id="stext">Loading index status…</span><div class="track"><div class="fill" id="sfill"></div></div></div>
  <div class="detail" id="sdetail"></div>
</div>
<div id="log"><div class="hint" id="hint"><p>Answers come from Elanthipedia and link back to the pages they used.</p></div></div>
<form id="form">
  <textarea id="q" rows="2" placeholder="e.g. What abilities do Barbarians get?" autofocus></textarea>
  <button id="send" type="submit">Ask</button>
</form>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'), send = document.getElementById('send');
let sessionId = null;
try { sessionId = localStorage.getItem('epedia.session'); } catch (e) {}

async function ensureSession() {
  if (sessionId) return;
  const r = await fetch('/api/sessions', { method: 'POST' });
  sessionId = (await r.json()).session_id;
  try { localStorage.setItem('epedia.session', sessionId); } catch (e) {}
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function renderText(text, sources) {
  let html = esc(text);
  // Markdown tables -> HTML tables (simple pipe tables)
  html = html.replace(/((?:^\|.*\|\s*$\n?)+)/gm, block => {
    const rows = block.trim().split('\n').filter(r => !/^\|\s*-+/.test(r));
    if (rows.length < 2) return block;
    const cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
    const head = '<tr>' + cells(rows[0]).map(c => `<th>${c}</th>`).join('') + '</tr>';
    const body = rows.slice(1).map(r => '<tr>' + cells(r).map(c => `<td>${c}</td>`).join('') + '</tr>').join('');
    return `<table>${head}${body}</table>`;
  });
  html = html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  html = html.replace(/\[(\d+)\]/g, (m, n) => {
    const s = sources[+n - 1];
    return s ? `<a class="cite" href="${esc(s.url)}" target="_blank" title="${esc(s.title)}">[${n}]</a>` : m;
  });
  return html;
}
function add(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = '<div class="note"></div><div class="body"></div><div class="sources"></div>';
  d.querySelector('.body').textContent = text || '';
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
function showSources(d, sources, cited, related) {
  const el = d.querySelector('.sources');
  let html = '';
  if (sources.length) html += '<b>Sources</b>' + sources.map(s =>
    `<div class="${cited.includes(s.n) ? 'cited' : ''}">[${s.n}] <a href="${esc(s.url)}" target="_blank">${esc(s.title)}${s.section ? ' — ' + esc(s.section) : ''}</a></div>`).join('');
  el.innerHTML = html;
  if (related && related.length) {
    const r = document.createElement('div');
    r.className = 'related';
    r.append('Pull on a thread: ');
    related.forEach(t => {
      const b = document.createElement('button');
      b.className = 'chip'; b.type = 'button'; b.textContent = t.replace(/^[A-Za-z]+:/, '');
      b.title = t; b.onclick = () => ask('Tell me about ' + t.replace(/^[A-Za-z]+:/, ''));
      r.append(b);
    });
    el.append(r);
  }
}
let persona = null;
function hintHtml(text) {
  const wrap = document.createElement('div');
  wrap.className = 'hint'; wrap.id = 'hint';
  const p = document.createElement('p'); p.textContent = text; wrap.append(p);
  const chips = document.createElement('div'); chips.className = 'chips';
  ((persona && persona.chips) || []).forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.textContent = c; b.onclick = () => ask(c);
    chips.append(b);
  });
  wrap.append(chips);
  return wrap;
}
async function loadPersona() {
  try {
    persona = await (await fetch('/api/persona')).json();
    document.getElementById('pname').textContent = persona.name;
    document.getElementById('ptag').textContent = persona.tagline;
    document.title = persona.enabled ? persona.name + ' · QQueryElanthia' : 'QQueryElanthia';
    const hint = document.getElementById('hint');
    if (hint) hint.replaceWith(hintHtml(persona.greeting));
  } catch (e) { /* the static hint stays */ }
}
async function ask(text) {
  document.getElementById('hint')?.remove();
  await ensureSession();
  add('user', text);
  const a = add('assistant', ''), body = a.querySelector('.body'), note = a.querySelector('.note');
  let full = '', sources = [];
  send.disabled = true;
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ session_id: sessionId, message: text }) });
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const raw = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = /event: (\w+)/.exec(raw)?.[1], data = JSON.parse(/data: (.*)/s.exec(raw)[1]);
        if (ev === 'sources') {
          sources = data.sources;
          const label = data.kind && data.kind !== 'general' && data.kind !== 'meta' ? ' (' + data.kind.replace('_', ' ') + ')' : '';
          if (label || (data.standalone_q && data.standalone_q.trim() !== text.trim())) note.textContent = 'Searching' + label + ': ' + data.standalone_q;
        } else if (ev === 'token') { full += data.text; body.textContent = full; }
        else if (ev === 'done') { body.innerHTML = renderText(full, sources); showSources(a, sources, data.cited, data.related); }
        else if (ev === 'error') { body.textContent = 'Error: ' + data.message; }
        log.scrollTop = log.scrollHeight;
      }
    }
  } catch (e) { body.textContent = 'Error: ' + e; }
  send.disabled = false; q.focus();
}
function fmtEta(min) { return min == null ? '' : ' · ETA ' + Math.floor(min / 60) + 'h ' + String(min % 60).padStart(2, '0') + 'm'; }
async function refreshStatus() {
  try {
    const s = await (await fetch('/api/status')).json();
    const pct = s.total ? s.fetched / s.total * 100 : 0;
    const state = s.complete ? 'complete' : s.crawling ? `<span class="live">● crawling ${s.crawl_per_min}/min</span>${fmtEta(s.eta_minutes)}` : '<span class="idle">○ crawl idle</span>';
    document.getElementById('stext').innerHTML = `Index: ${s.fetched.toLocaleString()} / ${s.total.toLocaleString()} pages (${pct.toFixed(1)}%) · ${state}`;
    document.getElementById('sfill').style.width = pct + '%';
    const rows = s.namespaces.map(n => `<tr><td>${n.ns} ${esc(n.name)}</td><td>${n.pages.toLocaleString()}</td><td>${n.fetched.toLocaleString()}</td><td>${n.indexed.toLocaleString()}</td><td>${n.errors}</td></tr>`).join('');
    document.getElementById('sdetail').innerHTML = `<table><tr><th>Namespace</th><th>Pages</th><th>Crawled</th><th>Searchable</th><th>Errors</th></tr>${rows}</table>` +
      `<div>${s.chunks.toLocaleString()} searchable chunks · ${s.errors} page errors${s.last_sync ? ' · last sync ' + esc(s.last_sync) : ''}${s.last_fetch ? ' · last fetch ' + esc(s.last_fetch) : ''}</div>`;
  } catch (e) { document.getElementById('stext').textContent = 'Index status unavailable'; }
}
document.getElementById('statusbar').addEventListener('click', () => document.getElementById('status').classList.toggle('open'));
refreshStatus(); setInterval(refreshStatus, 5000);
loadPersona();
document.getElementById('form').addEventListener('submit', e => { e.preventDefault(); const t = q.value.trim(); if (t) { q.value = ''; ask(t); } });
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('form').requestSubmit(); } });
document.getElementById('new').addEventListener('click', () => { sessionId = null; try { localStorage.removeItem('epedia.session'); } catch (e) {} log.innerHTML = ''; log.append(hintHtml(persona ? persona.greeting : 'New conversation.')); });
</script>
</body>
</html>
